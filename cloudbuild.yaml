steps:
  # 1. Build the Docker image
  # We use --build-arg because Vite needs these variables during the build process
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          -t asia-southeast2-docker.pkg.dev/$PROJECT_ID/specflow-repo/specflow-app:$COMMIT_SHA \
          --build-arg VITE_SUPABASE_URL=$$SUPABASE_URL \
          --build-arg VITE_SUPABASE_ANON_KEY=$$SUPABASE_ANON_KEY \
          .
    secretEnv: ['SUPABASE_URL', 'SUPABASE_ANON_KEY']

  # 2. Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/specflow-repo/specflow-app:$COMMIT_SHA']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'specflow-app'
      - '--image'
      - 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/specflow-repo/specflow-app:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast2'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # Set runtime environment variables from Secret Manager
      - '--set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest,VITE_SUPABASE_URL=VITE_SUPABASE_URL:latest,VITE_SUPABASE_ANON_KEY=VITE_SUPABASE_ANON_KEY:latest'

# Define where Cloud Build should get the secrets from
availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/VITE_SUPABASE_URL/versions/latest
    env: 'SUPABASE_URL'
  - versionName: projects/$PROJECT_ID/secrets/VITE_SUPABASE_ANON_KEY/versions/latest
    env: 'SUPABASE_ANON_KEY'

images:
  - 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/specflow-repo/specflow-app:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
